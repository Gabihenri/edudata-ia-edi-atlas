name: Automação EDI Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "00_FOUNDATION/**"
      - "01_FRAMEWORK_EDI/**"
      - "02_EIOS/**"
      - "07_KNOWLEDGE/**"
      - "09_COLLECTION/**"
      - "11_PUBLISHER/**"
      - "ADR/**"
      - "DECISIONS/**"
      - "DIAGRAMS/**"
      - "STATUS_OFICIAL.md"
      - "scripts/atlas_automation.py"

permissions:
  contents: write

concurrency:
  group: edi-atlas-automation
  cancel-in-progress: false

jobs:
  validate-and-update:

    name: Validar e atualizar Atlas

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar automação
        run: |
          python scripts/atlas_automation.py

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "EDI Atlas Bot"
          git config user.email "bot@edudataia.com"

      - name: Commit das alterações
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "Atualização automática do EDI Atlas"

      - name: Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin main
