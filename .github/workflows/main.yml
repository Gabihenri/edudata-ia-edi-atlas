name: Automação EDI Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - principal
    paths:
      - "00_FOUNDATION/**"
      - "01_FRAMEWORK_EDI/**"
      - "02_EIOS/**"
      - "07_KNOWLEDGE/**"
      - "09_COLLECTION/**"
      - "11_PUBLISHER/**"
      - "ADR/**"
      - "DECISIONS/**"
      - "DIAGRAMS/**"
      - "STATUS_OFICIAL.md"
      - "scripts/atlas_automation.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: edi-atlas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-update:
    name: Validar e atualizar Atlas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Executar automação
        run: python scripts/atlas_automation.py

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "EDI Atlas Bot"
          git config user.email "edudata-atlas-bot@users.noreply.github.com"

      - name: Registrar atualização automática
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add README.md STATUS_OFICIAL.md ATLAS_INDEX.md ATLAS_VALIDATION_REPORT.md
          git commit -m "docs(atlas): atualizar índice e status oficial"

      - name: Enviar alterações
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
