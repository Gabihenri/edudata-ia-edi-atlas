def normalize(value: str) -> str:
    normalized = unicodedata.normalize("NFKD", value)

    without_accents = "".join(
        character
        for character in normalized
        if not unicodedata.combining(character)
    )

    return re.sub(
        r"[^A-Z0-9]+",
        "_",
        without_accents.upper(),
    ).strip("_")


def relative_link(path: Path) -> str:
    return path.relative_to(ROOT).as_posix()


def markdown_title(path: Path) -> str:
    try:
        content = path.read_text(encoding="utf-8")
    except UnicodeDecodeError:
        return path.stem.replace("_", " ").replace("-", " — ")

    for line in content.splitlines():
        stripped = line.strip()

        if stripped.startswith("# "):
            return stripped[2:].strip()

    return path.stem.replace("_", " ").replace("-", " — ")


def list_root_directories() -> list[Path]:
    return sorted(
        (
            path
            for path in ROOT.iterdir()
            if path.is_dir()
            and path.name not in IGNORED_DIRECTORIES
        ),
        key=lambda path: normalize(path.name),
    )


def find_section_directory(
    section: AtlasSection,
) -> Path | None:
    normalized_aliases = {
        normalize(alias)
        for alias in section.aliases
    }

    for directory in list_root_directories():
        if normalize(directory.name) in normalized_aliases:
            return directory

    return None


def markdown_files(directory: Path) -> list[Path]:
    return sorted(
        (
            path
            for path in directory.rglob("*.md")
            if path.is_file()
            and path.name not in IGNORED_FILES
            and not any(
                part in IGNORED_DIRECTORIES
                for part in path.relative_to(ROOT).parts
            )
        ),
        key=lambda path: normalize(relative_link(path)),
    )


def all_markdown_files() -> list[Path]:
    return sorted(
        (
            path
            for path in ROOT.rglob("*.md")
            if path.is_file()
            and path.name not in IGNORED_FILES
            and not any(
                part in IGNORED_DIRECTORIES
                for part in path.relative_to(ROOT).parts
            )
        ),
        key=lambda path: normalize(relative_link(path)),
    )


def utc_timestamp() -> str:
    return datetime.now(timezone.utc).strftime(
        "%d/%m/%Y às %H:%M UTC"
    )


