        return

    STATUS_PATH.write_text(
        default_status_content(),
        encoding="utf-8",
    )


def build_index() -> tuple[str, dict[str, int]]:
    lines = [
        "# Índice Oficial do EDI Atlas",
        "",
        GENERATED_NOTICE,
        "",
        f"**Última atualização automática:** {utc_timestamp()}",
        "",
        "## Arquitetura oficial",
        "",
        "```text",
        "Framework EDI",
        "        ↓",
        "EIOS — Educational Intelligence Operating System",
        "        ↓",
        "Core Compartilhado",
        "        ↓",
        "Produtos Especializados",
        "```",
        "",
    ]

    statistics: dict[str, int] = {}
    indexed_paths: set[Path] = set()

    for section in SECTIONS:
        directory = find_section_directory(section)

        lines.extend(
            [
                f"## {section.title}",
                "",
            ]
        )

        if directory is None:
            statistics[section.identifier] = 0

            aliases = "`, `".join(section.aliases)

            lines.extend(
                [
                    (
                        "> Diretório não encontrado. "
                        f"Nomes aceitos: `{aliases}`."
                    ),
                    "",
                ]
            )

            continue

        files = markdown_files(directory)

        statistics[section.identifier] = len(files)
        indexed_paths.update(files)

        lines.extend(
            [
                f"**Diretório:** `{relative_link(directory)}`",
                "",
            ]
        )

        if not files:
            lines.extend(
                [
                    "_Nenhum documento Markdown encontrado._",
                    "",
                ]
            )

            continue

        for file_path in files:
            title = markdown_title(file_path)
            link = relative_link(file_path)

            lines.append(f"- [{title}]({link})")

        lines.append("")

    additional_files = [
        path
        for path in all_markdown_files()
        if path not in indexed_paths
        and path not in {
            README_PATH,
            STATUS_PATH,
            INDEX_PATH,
            REPORT_PATH,
        }
    ]

    if additional_files:
        lines.extend(
            [
                "## Outros documentos",
                "",
            ]
        )

        for file_path in additional_files:
            title = markdown_title(file_path)
            link = relative_link(file_path)

            lines.append(f"- [{title}]({link})")

        lines.append("")

    total_documents = (
        sum(statistics.values())
        + len(additional_files)
    )

    lines.extend(
        [
            "## Resumo quantitativo",
            "",
            f"- Seções oficiais previstas: **{len(SECTIONS)}**",
            f"- Documentos indexados: **{total_documents}**",
            (
                "- Documentos adicionais: "
                f"**{len(additional_files)}**"
            ),
            "",
        ]
    )

    return "\n".join(lines), statistics


def status_block() -> str:
    status_content = STATUS_PATH.read_text(
        encoding="utf-8"
    ).strip()

    if status_content.startswith("# "):
        status_content = "\n".join(
            status_content.splitlines()[1:]
        ).strip()

    return "\n".join(
        [
            STATUS_START,
            "",
            "## Status oficial da EduData IA",
            "",
            status_content,
            "",
            STATUS_END,
        ]
    )


def update_readme() -> None:
    if README_PATH.exists():
        content = README_PATH.read_text(
            encoding="utf-8"
        )
    else:
        content = (
            "# EDI Atlas\n\n"
            "Patrimônio intelectual oficial da EduData IA.\n"
        )

    block = status_block()

    pattern = re.compile(
        re.escape(STATUS_START)
        + r".*?"
        + re.escape(STATUS_END),
        flags=re.DOTALL,
    )

    if pattern.search(content):
        updated = pattern.sub(
            block,
            content,
        )
    else:
        updated = (
            content.rstrip()
            + "\n\n"
            + block
            + "\n"
        )

    README_PATH.write_text(
        updated,
        encoding="utf-8",
    )


def validate_structure(
    statistics: dict[str, int],
) -> tuple[list[str], list[str]]:
    errors: list[str] = []
    warnings: list[str] = []

    for section in SECTIONS:
        directory = find_section_directory(section)

        if directory is None:
            message = (
                f"Diretório da seção '{section.title}' "
                "não encontrado. Nomes aceitos: "
                f"{', '.join(section.aliases)}."
            )

            if section.required:
                errors.append(message)
            else:
                warnings.append(message)

            continue

        document_count = statistics.get(
            section.identifier,
            0,
        )

        if document_count == 0:
            warnings.append(
                f"A seção '{section.title}' existe, "
                "mas não contém documentos Markdown."
            )

    return errors, warnings


def build_report(
    errors: list[str],
    warnings: list[str],
    statistics: dict[str, int],
) -> str:
    result = (
        "APROVADO"
        if not errors
        else "REPROVADO"
    )

    lines = [
        "# Relatório de Validação do EDI Atlas",
        "",
        GENERATED_NOTICE,
        "",
        f"**Executado em:** {utc_timestamp()}",
        "",
        f"**Resultado:** `{result}`",
        "",
        "## Documentos por seção",
        "",
    ]

    for section in SECTIONS:
        count = statistics.get(
            section.identifier,
            0,
        )

        lines.append(
            f"- {section.title}: **{count}**"
        )

    lines.extend(
        [
            "",
            "## Erros",
            "",
        ]
    )

    if errors:
        lines.extend(
            f"- {error}"
            for error in errors
        )
    else:
        lines.append(
            "- Nenhum erro estrutural encontrado."
        )

    lines.extend(
        [
            "",
            "## Avisos",
            "",
        ]
    )

    if warnings:
        lines.extend(
            f"- {warning}"
            for warning in warnings
        )
    else:
        lines.append(
            "- Nenhum aviso encontrado."
        )

    lines.extend(
        [
            "",
            "## Arquitetura obrigatória",
            "",
            "```text",
            "Framework EDI",
            "        ↓",
            "EIOS",
            "        ↓",
            "Core Compartilhado",
            "        ↓",
            "Produtos Especializados",
            "```",
            "",
        ]
    )

    return "\n".join(lines)


def main() -> int:
    try:
        ensure_status_file()

        index_content, statistics = build_index()

        errors, warnings = validate_structure(
            statistics
        )

        INDEX_PATH.write_text(
            index_content.strip() + "\n",
            encoding="utf-8",
        )

        update_readme()

        report_content = build_report(
            errors=errors,
            warnings=warnings,
            statistics=statistics,
        )

        REPORT_PATH.write_text(
            report_content.strip() + "\n",
            encoding="utf-8",
        )

        print("EDI Atlas processado com sucesso.")
        print(
            f"Índice: {relative_link(INDEX_PATH)}"
        )
        print(
            f"Status: {relative_link(STATUS_PATH)}"
        )
        print(
            f"Relatório: {relative_link(REPORT_PATH)}"
        )
        print(
            f"README: {relative_link(README_PATH)}"
        )

        if warnings:
            print("\nAvisos encontrados:")

            for warning in warnings:
                print(f"- {warning}")

        if errors:
            print(
                "\nErros estruturais encontrados:",
                file=sys.stderr,
            )

            for error in errors:
                print(
                    f"- {error}",
                    file=sys.stderr,
                )

            return 1

        return 0

    except Exception as error:
        print(
            (
                "Falha inesperada na automação "
                f"do EDI Atlas: {error}"
            ),
            file=sys.stderr,
        )

        return 1


if __name__ == "__main__":
    raise SystemExit(main())
