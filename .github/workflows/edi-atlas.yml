name: Automação EDI Atlas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar somente em modo de simulação"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.json"
      - "scripts/**"
      - ".github/workflows/edi-atlas.yml"

  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: edi-atlas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  knowledge-engine:
    name: Executar EDI Knowledge Engine

    if: >
      github.event_name != 'push' ||
      github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar sintaxe do Knowledge Engine
        run: |
          python -m py_compile scripts/knowledge_engine.py

      - name: Executar Knowledge Engine em modo normal
        if: >
          github.event_name != 'workflow_dispatch' ||
          inputs.dry_run != true
        run: |
          python scripts/knowledge_engine.py

      - name: Executar Knowledge Engine em modo de simulação
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true
        run: |
          python scripts/knowledge_engine.py --dry-run

      - name: Remover arquivos temporários do Python
        shell: bash
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

      - name: Exibir alterações geradas
        shell: bash
        run: |
          git status --short

      - name: Verificar alterações geradas
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar identidade do bot
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "EDI Atlas Bot"
          git config user.email \
            "edudata-atlas-bot@users.noreply.github.com"

      - name: Preparar documentos gerados na raiz
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          files=(
            "README.md"
            "STATUS_OFICIAL.md"
            "ATLAS_INDEX.md"
            "ATLAS_VALIDATION_REPORT.md"
            "ATLAS_INVENTORY.md"
            "ATLAS_INVENTORY.json"
            "DEPENDENCY_GRAPH.md"
            "CHANGE_IMPACT_REPORT.md"
            "ATLAS_SYNC_REPORT.md"
            "ATLAS_HEALTH.md"
            "METADATA_REPORT.md"
            "BROKEN_LINKS.md"
            "DUPLICATED_IDS.md"
            "KNOWLEDGE_ENGINE_REPORT.md"
            "KNOWLEDGE_ENGINE_REPORT.json"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

      - name: Preparar índices automáticos das subpastas
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          directories=(
            "07_KNOWLEDGE"
            "09_COLLECTION"
            "11_PUBLISHER"
          )

          for directory in "${directories[@]}"; do
            if [ -d "$directory" ]; then
              while IFS= read -r -d '' file; do
                git add "$file"
              done < <(
                find "$directory" \
                  -type f \
                  -name "AUTO_INDEX.md" \
                  -print0
              )
            fi
          done

      - name: Preparar remoções de índices obsoletos
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git add -u \
            "07_KNOWLEDGE" \
            "09_COLLECTION" \
            "11_PUBLISHER" \
            2>/dev/null || true

      - name: Registrar atualização automática
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração documental para registrar."
          else
            git commit \
              -m "docs(atlas): executar EDI Knowledge Engine"

            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar branch antes do envio
        if: steps.commit.outputs.created == 'true'
        shell: bash
        run: |
          git pull \
            --rebase \
            --autostash \
            origin main

      - name: Enviar alterações para main
        if: steps.commit.outputs.created == 'true'
        shell: bash
        run: |
          git push origin main
