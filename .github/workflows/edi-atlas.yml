name: Automação EDI Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/**"
      - ".github/workflows/edi-atlas.yml"

  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: edi-atlas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-update:
    name: Validar e atualizar Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validar sintaxe do script
        run: python -m py_compile scripts/atlas_automation.py

      - name: Executar varredura completa do Atlas
        run: python scripts/atlas_automation.py

      - name: Remover arquivos temporários do Python
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Verificar alterações geradas
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar identidade do bot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "EDI Atlas Bot"
          git config user.email "edudata-atlas-bot@users.noreply.github.com"

      - name: Registrar atualização documental
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add README.md STATUS_OFICIAL.md ATLAS_INDEX.md ATLAS_VALIDATION_REPORT.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração documental para registrar."
          else
            git commit -m "docs(atlas): sincronizar índice, status e validação"
          fi

      - name: Enviar alterações para main
        if: steps.changes.outputs.changed == 'true'
        run: |
          if git log -1 --pretty=%B | grep -q "docs(atlas): sincronizar índice, status e validação"; then
            git push origin main
          else
            echo "Nenhum commit novo para enviar."
          fi
