name: Automação EDI Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.json"
      - "scripts/**"
      - ".github/workflows/edi-atlas.yml"

  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: edi-atlas-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-update:
    name: Validar e atualizar Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar sintaxe dos scripts
        run: |
          python -m py_compile scripts/atlas_automation.py
          python -m py_compile scripts/atlas_parser.py
          python -m py_compile scripts/atlas_dependency_engine.py

      - name: Executar automação principal do Atlas
        run: python scripts/atlas_automation.py

      - name: Executar inventário completo
        run: python scripts/atlas_parser.py

      - name: Executar análise de dependências
        run: python scripts/atlas_dependency_engine.py

      - name: Remover arquivos temporários do Python
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Verificar alterações geradas
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar identidade do bot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "EDI Atlas Bot"
          git config user.email "edudata-atlas-bot@users.noreply.github.com"

      - name: Preparar arquivos gerados
        if: steps.changes.outputs.changed == 'true'
        run: |
          files=(
            "README.md"
            "STATUS_OFICIAL.md"
            "ATLAS_INDEX.md"
            "ATLAS_VALIDATION_REPORT.md"
            "ATLAS_INVENTORY.md"
            "ATLAS_INVENTORY.json"
            "DEPENDENCY_GRAPH.md"
            "CHANGE_IMPACT_REPORT.md"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

      - name: Registrar atualização documental
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração documental para registrar."
          else
            git commit -m "docs(atlas): atualizar inventário, dependências e impacto"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar alterações para main
        if: steps.commit.outputs.created == 'true'
        run: git push origin main
